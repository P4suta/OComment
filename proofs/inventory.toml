version = 1
harness = "proofs/keep_blocks.rs"

[[sources]]
module = "production"
path = "rust/ocomment-core/src/keep_blocks.rs"

[[sources]]
module = "admission"
path = "rust/xtask/src/proof_rules.rs"

[[harnesses]]
name = "adjacency_up_to_16_bytes_matches_logical_line_endings"
kind = "proof"
covers = 2
assertions = ["adjacency agrees with the bounded byte specification"]

[[harnesses]]
name = "blocks_of_0_members_keep_exactly_the_matching_run"
kind = "proof"
covers = 1
assertions = ["every member receives one decision"]

