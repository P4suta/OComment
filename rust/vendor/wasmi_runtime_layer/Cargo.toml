[package]
name = "ocomment-wasmi-runtime-layer"
version = "0.31.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/P4suta/OComment"
readme = "README.md"
description = "OComment's pinned wasmi runtime-layer adapter"

[lib]
name = "wasmi_runtime_layer"

[dependencies]
anyhow = { version = "1.0", features = ["std"], default-features = false }
ref-cast = { version = "1.0", default-features = false }
smallvec = { version = "1.11", default-features = false }
wasm_runtime_layer = { package = "ocomment-wasm-runtime-layer", version = "=0.4.2", path = "../wasm_runtime_layer" }
wasmi = { version = "0.31.0", features = ["std"], default-features = false }
