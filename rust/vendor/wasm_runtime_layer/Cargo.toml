[package]
name = "ocomment-wasm-runtime-layer"
version = "0.4.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/P4suta/OComment"
description = "OComment's resource-limit extension of wasm_runtime_layer"

[lib]
name = "wasm_runtime_layer"

[dependencies]
anyhow = { version = "1.0", default-features = false, features = ["std"] }
fxhash = { version = "0.2", default-features = false }
ref-cast = { version = "1.0", default-features = false }
smallvec = { version = "1.11", default-features = false }
