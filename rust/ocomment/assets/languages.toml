version = 1

# The canonical list of the languages OComment has a built-in scanner for.
#
# `extensions` holds every suffix that selects the language, without the dot,
# and `dialects` every dialect it accepts, in the order the binary lists them
# when it refuses one. An extension that selects a dialect other than
# `standard` says so in `extension_dialects`; `reserved_names` and `shebangs`
# are the whole file names and interpreter names that select the language when
# the extension does not decide it. `notes` is a remark for the human listing.
#
# The `files:` pattern of the published pre-commit hooks is generated from the
# extensions here (tools/check_hooks.py), docs/languages.md is generated from
# the whole table (tools/gen_docs.py), and `ocomment languages` prints the copy
# the binary embeds. rust/ocomment/tests/spec_languages.rs checks every claim
# below against the detector and the binary.

[[languages]]
name = "rust"
extensions = ["rs"]
dialects = ["standard"]

[[languages]]
name = "ocaml"
extensions = ["ml", "mli"]
dialects = ["standard"]
notes = "OCaml 5.5 lexical forms"

[[languages]]
name = "c"
extensions = ["c", "h", "m"]
dialects = ["standard", "objective-c", "gnu-c"]
extension_dialects = { m = "objective-c" }

[[languages]]
name = "cpp"
extensions = ["cc", "cpp", "cxx", "hpp", "mm", "cu"]
dialects = ["standard", "objective-cpp", "gnu-cpp", "cuda"]
extension_dialects = { mm = "objective-cpp", cu = "cuda" }

[[languages]]
name = "go"
extensions = ["go"]
dialects = ["standard"]

[[languages]]
name = "java"
extensions = ["java"]
dialects = ["standard"]
notes = "Unicode escape translation"

[[languages]]
name = "javascript"
extensions = ["js", "mjs", "cjs", "jsx"]
dialects = ["standard", "jsx"]
extension_dialects = { jsx = "jsx" }
shebangs = ["node", "deno"]

[[languages]]
name = "typescript"
extensions = ["ts", "mts", "cts", "tsx"]
dialects = ["standard", "tsx"]
extension_dialects = { tsx = "tsx" }

[[languages]]
name = "python"
extensions = ["py", "pyw", "pyi"]
dialects = ["standard"]
shebangs = ["python"]

[[languages]]
name = "shell"
extensions = ["sh", "bash", "zsh"]
dialects = ["standard", "posix-sh", "bash53", "zsh"]
extension_dialects = { sh = "posix-sh", bash = "bash53", zsh = "zsh" }
reserved_names = [
    "Dockerfile",
    "Containerfile",
    "Makefile",
    "GNUmakefile",
    ".profile",
    ".bashrc",
    ".zshrc",
]
shebangs = ["sh", "bash", "zsh"]

[[languages]]
name = "html"
extensions = ["html", "htm", "xhtml"]
dialects = ["standard"]
notes = "script and style bodies are scanned as JavaScript and CSS"

[[languages]]
name = "css"
extensions = ["css"]
dialects = ["standard"]

[[languages]]
name = "jsonc"
extensions = ["jsonc", "json5"]
dialects = ["standard"]
reserved_names = ["tsconfig.json", "jsconfig.json"]

[[languages]]
name = "sql"
extensions = ["sql"]
dialects = ["standard", "postgresql", "mysql", "sqlite", "t-sql", "oracle"]

[[languages]]
name = "kotlin"
extensions = ["kt", "kts"]
dialects = ["standard"]
