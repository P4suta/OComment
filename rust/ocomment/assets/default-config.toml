version = 1

# Which files are read at all.
[files]
max_size = 33554432
hidden = false
follow_symlinks = false
ignore = true
include_generated = false
# Narrow the walk, or carve paths out of it. Globs are relative to the
# directory this file is in, and `include` is a whitelist when it is not empty.
# include = ["src/**", "tests/**"]
# exclude = ["vendor/**", "third_party/**"]

# What may be removed from the files that were read.
[policy]
mode = "conservative"
layout = "lines"
keep_kind = []
remove_kind = []
keep_regex = []
remove_regex = []
force_invalid = false
force_protected = false

# A different decision for one part of the tree. Every entry whose `paths`
# match is applied in order, over `[policy]` above, and each may set any of
# `policy`, `layout`, `language`, `dialect`, `keep_kind`, `remove_kind`,
# `keep_regex` and `remove_regex`.
#
# [[overrides]]
# paths = ["src/generated/**"]
# policy = "all"
#
# [[overrides]]
# paths = ["scripts/**"]
# keep_kind = ["line", "block"]

# A syntax with no built-in scanner, described by its delimiters. `ocomment
# languages` lists the ones that need no profile.
#
# [profiles.ini]
# name = "ini"
# extensions = ["ini", "cfg"]
# line_comments = [{ start = ";", kind = "line" }]

[git]
staged = false
index_only = false

[lsp]
on_save = false
diagnostics = true
code_lens = true

[plugins]
enabled = []
routes = {}
memory_mib = 64
instances = 4
fuel_per_byte = 128
