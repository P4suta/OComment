# NOTE: Hook definitions consumed by pre-commit when this repository is used as a
# NOTE: `repo:` entry. Both hooks deliberately receive every text file selected by
# NOTE: pre-commit: OComment's detector, not a second extension list, decides which
# NOTE: files are supported. This is what lets reserved names and extensionless
# NOTE: shebang scripts reach the same detector as an ordinary CLI run.
# NOTE:
# NOTE: `language: system` requires `ocomment` to already be on PATH: pre-commit's
# NOTE: `language: rust` runs `cargo install --path .` at the checkout root, and this
# NOTE: repository's manifest lives in rust/, so it cannot build these hooks.
- id: ocomment-check
  name: ocomment check
  description: 'Report removable comments in the text files from pre-commit staging; pre-commit temporarily hides unstaged changes, exit 1 blocks the commit, and exit 2 reports an invalid source, configuration, plugin, or I/O failure.'
  entry: ocomment check
  language: system
  types: [text]
- id: ocomment-fix
  name: ocomment fix
  description: 'Remove comments from pre-commit-selected text files in place; pre-commit blocks the commit when a file changes so the result can be reviewed and staged.'
  entry: ocomment fix
  language: system
  types: [text]
  require_serial: true
