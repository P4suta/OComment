# NOTE: Hook definitions pre-commit reads when this repository is a `repo:`
# NOTE: entry. Why they take every text file, and why `language: system`:
# NOTE: see "The published pre-commit hooks" in docs/ci.md.
- id: ocomment-check
  name: ocomment check
  description: 'Report removable comments in the text files from pre-commit staging; pre-commit temporarily hides unstaged changes, exit 1 blocks the commit, and exit 2 reports an invalid source, configuration, plugin, or I/O failure.'
  entry: ocomment check
  language: system
  types: [text]
- id: ocomment-fix
  name: ocomment fix
  description: 'Remove comments from pre-commit-selected text files in place; pre-commit blocks the commit when a file changes so the result can be reviewed and staged.'
  entry: ocomment fix
  language: system
  types: [text]
  require_serial: true
