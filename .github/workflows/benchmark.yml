name: Fixed-runner benchmark

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA to benchmark
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  verify-commit:
    if: vars.OCOMMENT_BENCHMARK_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Require the exact full commit SHA
        id: commit
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${REQUESTED_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::commit_sha must be a full 40-character hexadecimal commit SHA"
            exit 2
          fi
          resolved=$(git rev-parse 'HEAD^{commit}')
          if [ "${resolved,,}" != "${REQUESTED_SHA,,}" ]; then
            echo "::error::checkout resolved ${resolved}, not ${REQUESTED_SHA}"
            exit 2
          fi
          printf 'commit_sha=%s\n' "${resolved}" >>"${GITHUB_OUTPUT}"

  gate:
    needs: verify-commit
    environment: benchmark
    runs-on: [self-hosted, linux, x64, ocomment-benchmark, ephemeral]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-commit.outputs.commit_sha }}
          clean: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # NOTE: stable toolchain action
      - run: cargo build --manifest-path rust/Cargo.toml --release --locked -p ocomment
      - run: cargo build --manifest-path rust/Cargo.toml --release --locked -p ocomment-core --example throughput
      - run: python3 tools/release_gate.py
