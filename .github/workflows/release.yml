name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cargo build --manifest-path rust/Cargo.toml --release --locked -p ocomment
      - run: python3 tools/release_extras.py --binary rust/target/release/ocomment
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-extras
          path: release-extras/
          if-no-files-found: error

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            build_tool: cargo
            cross: false
            tar: all
            zip: none
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            build_tool: cross
            cross: true
            tar: all
            zip: none
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            build_tool: cross
            cross: true
            tar: all
            zip: none
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            build_tool: cross
            cross: true
            tar: all
            zip: none
          - target: x86_64-apple-darwin
            os: macos-15-intel
            build_tool: cargo
            cross: false
            tar: all
            zip: none
          - target: aarch64-apple-darwin
            os: macos-15
            build_tool: cargo
            cross: false
            tar: all
            zip: none
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            build_tool: cargo
            cross: false
            tar: none
            zip: all
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-extras
          path: release-extras
      - id: package
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: ocomment
          package: ocomment
          manifest-path: rust/Cargo.toml
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build_tool }}
          locked: true
          archive: ocomment-${{ matrix.target }}
          tar: ${{ matrix.tar }}
          zip: ${{ matrix.zip }}
          checksum: sha256
          include: LICENSE-MIT,LICENSE-APACHE,README.md,release-extras/ocomment.1,release-extras/ocomment.bash,release-extras/_ocomment,release-extras/ocomment.fish,release-extras/_ocomment.ps1,release-extras/ocomment.elv
          leading-dir: true
          dry-run: true
          dry-run-intended: true
      - name: Native Unix smoke test
        if: runner.os != 'Windows' && !matrix.cross
        run: '"./rust/target/${TARGET}/release/ocomment" --version'
      - name: Cross Linux smoke test
        if: matrix.cross
        run: cross run --manifest-path rust/Cargo.toml --locked -p ocomment --target "$TARGET" -- --version
      - name: Native Windows smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "rust/target/$env:TARGET/release/ocomment.exe" --version'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ocomment-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.tar }}
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha256 }}
          if-no-files-found: error

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # Download artifacts produced by the build matrix.
      artifact-metadata: write # Attach artifact attestations to uploaded assets.
      attestations: write # Publish build provenance attestations.
      contents: write # Create the immutable GitHub release for the pushed tag.
      id-token: write # Obtain keyless Sigstore identities for signing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ocomment-*
          path: release
          merge-multiple: true
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: release
          format: spdx-json
          output-file: release/ocomment.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate package-manager definitions
        run: >-
          python3 tools/release_manifests.py
          --release-dir release
          --version "$GITHUB_REF_NAME"
          --repository "$GITHUB_REPOSITORY"
      - name: Generate combined checksums
        working-directory: release
        run: >-
          sha256sum ocomment-*.tar.gz ocomment-*.zip ocomment.spdx.json
          ocomment.rb ocomment-scoop.json ocomment.winget.yaml > SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign every release subject
        shell: bash
        run: |
          while IFS= read -r -d '' asset; do
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "$asset"
          done < <(find release -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.spdx.json' -o -name '*.rb' -o -name '*-scoop.json' -o -name '*.winget.yaml' -o -name 'SHA256SUMS' \) -print0)
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag

  publish-crates:
    needs: publish-release
    runs-on: ubuntu-latest
    environment: crates-io
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: ./tools/publish-crates.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
