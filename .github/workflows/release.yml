name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # NOTE: stable toolchain action
      - run: cargo build --manifest-path rust/Cargo.toml --release --locked -p ocomment
      - name: Verify every release version and the tag ancestry
        run: >-
          python3 tools/release_metadata.py
          --tag "${GITHUB_REF_NAME}"
          --binary rust/target/release/ocomment

  prepare:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # NOTE: stable toolchain action
      - run: cargo build --manifest-path rust/Cargo.toml --release --locked -p ocomment
      - run: python3 tools/release_extras.py --binary rust/target/release/ocomment
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-extras
          path: release-extras/
          if-no-files-found: error

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            build_tool: cargo
            cross: false
            tar: all
            zip: none
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            build_tool: cross
            cross: true
            tar: all
            zip: none
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            build_tool: cross
            cross: true
            tar: all
            zip: none
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            build_tool: cross
            cross: true
            tar: all
            zip: none
          - target: x86_64-apple-darwin
            os: macos-15-intel
            build_tool: cargo
            cross: false
            tar: all
            zip: none
          - target: aarch64-apple-darwin
            os: macos-15
            build_tool: cargo
            cross: false
            tar: all
            zip: none
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            build_tool: cargo
            cross: false
            tar: none
            zip: all
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # NOTE: stable toolchain action
        with:
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-extras
          path: release-extras
      - id: package
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: ocomment
          package: ocomment
          manifest-path: rust/Cargo.toml
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build_tool }}
          locked: true
          archive: ocomment-${{ matrix.target }}
          tar: ${{ matrix.tar }}
          zip: ${{ matrix.zip }}
          checksum: sha256
          include: LICENSE-MIT,LICENSE-APACHE,README.md,release-extras/ocomment.1,release-extras/ocomment.bash,release-extras/_ocomment,release-extras/ocomment.fish,release-extras/_ocomment.ps1,release-extras/ocomment.elv
          leading-dir: true
          dry-run: true
          dry-run-intended: true
      - name: Native Unix smoke test
        if: runner.os != 'Windows' && !matrix.cross
        run: '"./rust/target/${TARGET}/release/ocomment" --version'
      - name: Cross Linux smoke test
        if: matrix.cross
        run: cross run --manifest-path rust/Cargo.toml --locked -p ocomment --target "$TARGET" -- --version
      - name: Native Windows smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "rust/target/$env:TARGET/release/ocomment.exe" --version'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocomment-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.tar }}
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha256 }}
          if-no-files-found: error

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # NOTE: Download artifacts produced by the build matrix.
      artifact-metadata: write # NOTE: Attach artifact attestations to uploaded assets.
      attestations: write # NOTE: Publish build provenance attestations.
      contents: write # NOTE: Create the immutable GitHub release for the pushed tag.
      id-token: write # NOTE: Obtain keyless Sigstore identities for signing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ocomment-*
          path: release
          merge-multiple: true
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: release
          format: spdx-json
          output-file: release/ocomment.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate package-manager definitions
        run: >-
          python3 tools/release_manifests.py
          --release-dir release
          --version "$GITHUB_REF_NAME"
          --repository "$GITHUB_REPOSITORY"
      - name: Generate combined checksums
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum \
            ocomment-*.tar.gz \
            ocomment-*.zip \
            ocomment-*.sha256 \
            ocomment.spdx.json \
            ocomment.rb \
            ocomment-scoop.json \
            ocomment.winget.yaml >SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign every release subject
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' asset; do
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "$asset"
          done < <(find release -maxdepth 1 -type f ! -name '*.sigstore.json' -print0)
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip
            release/*.sha256
            release/*.spdx.json
            release/*.rb
            release/*-scoop.json
            release/*.winget.yaml
            release/SHA256SUMS
      - name: Create or refresh the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft >release-state; then
            if [ "$(cat release-state)" != "true" ]; then
              echo "::error::${GITHUB_REF_NAME} is already public; refusing to replace its assets"
              exit 2
            fi
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --draft --generate-notes --verify-tag
          fi

  publish-container:
    needs: draft-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # NOTE: Download the musl archives the build matrix produced.
      attestations: write # NOTE: Publish build provenance for the pushed image.
      contents: read # NOTE: Read the Dockerfile and the licences out of the tag.
      id-token: write # NOTE: Obtain keyless Sigstore identities for signing.
      packages: write # NOTE: Push the image into this repository's GHCR namespace.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ocomment-*-unknown-linux-musl
          path: musl
          merge-multiple: true
      # NOTE: The image ships the binaries this release already built, smoke tested,
      # NOTE: signed, and published as archives rather than a second compilation of
      # NOTE: the same tag. `builder` below is the buildx named context the Dockerfile
      # NOTE: copies from, so this layout is the whole contract between them.
      - name: Lay the released musl binaries out as the `builder` context
        shell: bash
        run: |
          set -euo pipefail
          extract() {
            mkdir -p "release/binaries/out/$2"
            tar -xzf "musl/ocomment-$1.tar.gz" -C "release/binaries/out/$2" \
              --strip-components=1 "ocomment-$1/ocomment"
            chmod 0755 "release/binaries/out/$2/ocomment"
          }
          extract x86_64-unknown-linux-musl amd64
          extract aarch64-unknown-linux-musl arm64
      # NOTE: GHCR rejects an uppercase path, and this repository has one.
      - name: Resolve the GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=ocomment
            org.opencontainers.image.description=Fast, byte-preserving comment checker and remover
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/docker.md
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          build-contexts: builder=release/binaries
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the pushed image
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish-crates:
    needs: draft-release
    runs-on: ubuntu-latest
    environment: crates-io
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # NOTE: stable toolchain action
      - run: ./tools/publish-crates.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  finalize:
    needs:
      - publish-container
      - publish-crates
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: write # NOTE: Publish the already complete draft release.
    steps:
      - name: Publish the completed draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release edit "${GITHUB_REF_NAME}"
          --repo "${GITHUB_REPOSITORY}"
          --draft=false
          --latest
