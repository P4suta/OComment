name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # NOTE: stable toolchain action
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: v2026.10.14
          sha256: 50be7185bcf75929f01cc5630276bcb43ca367f7c5b176e2580903d28c611dc4
          install: false
          cache: false
      - name: Verify the source-bound comment block contracts
        run: |
          mise trust --quiet proofs/mise.toml
          mise -C proofs x rust cargo:kani-verifier -- cargo kani setup
          mise -C proofs x rust cargo:kani-verifier -- cargo run --locked --manifest-path ../rust/Cargo.toml -p xtask -- proofs
      - run: cargo build --manifest-path rust/Cargo.toml --release --locked -p ocomment
      - name: Verify every release version and the tag ancestry
        run: >-
          python3 tools/release_metadata.py
          --tag "${GITHUB_REF_NAME}"
          --binary rust/target/release/ocomment

  prepare:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # NOTE: stable toolchain action
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - run: cargo build --manifest-path rust/Cargo.toml --release --locked -p ocomment
      - run: python3 tools/release_extras.py --binary rust/target/release/ocomment
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-extras
          path: release-extras/
          if-no-files-found: error

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            build_tool: cargo
            cross: false
            tar: all
            zip: none
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            build_tool: cross
            cross: true
            tar: all
            zip: none
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            build_tool: cross
            cross: true
            tar: all
            zip: none
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            build_tool: cross
            cross: true
            tar: all
            zip: none
          - target: x86_64-apple-darwin
            os: macos-15-intel
            build_tool: cargo
            cross: false
            tar: all
            zip: none
          - target: aarch64-apple-darwin
            os: macos-15
            build_tool: cargo
            cross: false
            tar: all
            zip: none
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            build_tool: cargo
            cross: false
            tar: none
            zip: all
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # NOTE: stable toolchain action
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-extras
          path: release-extras
      - id: package
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: ocomment
          package: ocomment
          manifest-path: rust/Cargo.toml
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build_tool }}
          locked: true
          archive: ocomment-${{ matrix.target }}
          tar: ${{ matrix.tar }}
          zip: ${{ matrix.zip }}
          checksum: sha256
          include: LICENSE-MIT,LICENSE-APACHE,README.md,release-extras/ocomment.1,release-extras/ocomment.bash,release-extras/_ocomment,release-extras/ocomment.fish,release-extras/_ocomment.ps1,release-extras/ocomment.elv
          leading-dir: true
          dry-run: true
          dry-run-intended: true
      - name: Native Unix smoke test
        if: runner.os != 'Windows' && !matrix.cross
        run: '"./rust/target/${TARGET}/release/ocomment" --version'
      - name: Cross Linux smoke test
        if: matrix.cross
        run: cross run --manifest-path rust/Cargo.toml --locked -p ocomment --target "$TARGET" -- --version
      - name: Native Windows smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "rust/target/$env:TARGET/release/ocomment.exe" --version'
      - name: Test native release targets
        if: ${{ !matrix.cross }}
        run: cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --release --locked --target "${{ matrix.target }}"
      - name: Create the action fixture
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p action-fixture
          printf 'fn main() {\n    let value = 1; // removable\n}\n' >action-fixture/sample.rs
          printf 'def sample():\n    return 1  # removable\n' >action-fixture/sample.py
      - name: Test the action on the native release binary
        if: ${{ !matrix.cross }}
        id: smoke
        uses: ./
        with:
          command: check
          paths: action-fixture
          format: sarif
          sarif-file: ocomment.sarif
          upload-sarif: "false"
          fail-on-findings: "false"
          verify-attestation: "false"
          binary-path: rust/target/${{ matrix.target }}/release/ocomment
      - name: Validate the native action result
        if: ${{ !matrix.cross }}
        shell: bash
        env:
          SMOKE_EXIT_CODE: ${{ steps.smoke.outputs.exit-code }}
          SMOKE_SARIF_FILE: ${{ steps.smoke.outputs.sarif-file }}
          SMOKE_VERSION: ${{ steps.smoke.outputs.version }}
        run: |
          set -euo pipefail
          test "${SMOKE_EXIT_CODE}" = "1"
          test -n "${SMOKE_VERSION}"
          python=python3
          command -v python3 >/dev/null 2>&1 || python=python
          "${python}" tools/validate_schemas.py --sarif "${SMOKE_SARIF_FILE}" | tee sarif-report.txt
          grep -q 'with 2 ocomment results' sarif-report.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocomment-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.tar }}
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha256 }}
          if-no-files-found: error

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # NOTE: Download artifacts produced by the build matrix.
      actions: read
      # NOTE: Attach artifact attestations to uploaded assets.
      artifact-metadata: write
      # NOTE: Publish build provenance attestations.
      attestations: write
      # NOTE: Create the immutable GitHub release for the pushed tag.
      contents: write
      # NOTE: Obtain keyless Sigstore identities for signing.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ocomment-*
          path: release
          merge-multiple: true
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: release
          format: spdx-json
          output-file: release/ocomment.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate package-manager definitions
        run: >-
          python3 tools/release_manifests.py
          --release-dir release
          --version "$GITHUB_REF_NAME"
          --repository "$GITHUB_REPOSITORY"
      - name: Generate combined checksums
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum \
            ocomment-*.tar.gz \
            ocomment-*.zip \
            ocomment-*.sha256 \
            ocomment.spdx.json \
            ocomment.rb \
            ocomment-scoop.json \
            ocomment.winget.yaml >SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign every release subject
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' asset; do
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "$asset"
          done < <(find release -maxdepth 1 -type f ! -name '*.sigstore.json' -print0)
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip
            release/*.sha256
            release/*.spdx.json
            release/*.rb
            release/*-scoop.json
            release/*.winget.yaml
            release/SHA256SUMS
      - name: Create or refresh the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft >release-state; then
            if [ "$(cat release-state)" != "true" ]; then
              echo "::error::${GITHUB_REF_NAME} is already public; refusing to replace its assets"
              exit 2
            fi
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --draft --generate-notes --verify-tag
          fi

  publish-container:
    needs: draft-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # NOTE: Download the musl archives the build matrix produced.
      actions: read
      # NOTE: Publish build provenance for the pushed image.
      attestations: write
      # NOTE: Read the Dockerfile and the licences out of the tag.
      contents: read
      # NOTE: Obtain keyless Sigstore identities for signing.
      id-token: write
      # NOTE: Push the image into this repository's GHCR namespace.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ocomment-*-unknown-linux-musl
          path: musl
          merge-multiple: true
      # NOTE: The image ships the binaries this release already built, smoke tested,
      # NOTE: signed, and published as archives rather than a second compilation of the same tag.
      # NOTE: `builder` below is the buildx named context the Dockerfile copies from, so this layout is the whole contract between them.
      - name: Lay the released musl binaries out as the `builder` context
        shell: bash
        run: |
          set -euo pipefail
          extract() {
            mkdir -p "release/binaries/out/$2"
            tar -xzf "musl/ocomment-$1.tar.gz" -C "release/binaries/out/$2" \
              --strip-components=1 "ocomment-$1/ocomment"
            chmod 0755 "release/binaries/out/$2/ocomment"
          }
          extract x86_64-unknown-linux-musl amd64
          extract aarch64-unknown-linux-musl arm64
      # NOTE: GHCR rejects an uppercase path, and this repository has one.
      - name: Resolve the GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=ocomment
            org.opencontainers.image.description=Fast, byte-preserving comment checker and remover
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/docker.md
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-contexts: builder=release/binaries
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the pushed image
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish-crates:
    needs: draft-release
    runs-on: ubuntu-latest
    environment: crates-io
    timeout-minutes: 30
    permissions:
      contents: read
      # NOTE: Exchange GitHub OIDC for a short-lived crates.io token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # NOTE: stable toolchain action
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Authenticate to crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - run: ./tools/publish-crates.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  finalize:
    needs:
      - publish-container
      - publish-crates
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      # NOTE: Publish the already complete draft release.
      contents: write
    steps:
      - name: Publish the completed draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release edit "${GITHUB_REF_NAME}"
          --repo "${GITHUB_REPOSITORY}"
          --draft=false
          --latest
