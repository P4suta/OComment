name: Docs

on:
  push:
    branches: [main]
    # The generated pages under docs/ are what a CLI change moves, and the
    # `rust` job of CI fails until they are regenerated in the same commit, so
    # a change that alters `--help` reaches this filter as a docs/ change.
    paths:
      - docs/**
      - spec/**
      - tools/gen_docs.py
      - .github/workflows/docs.yml
  # No path filter here: `docs` is a required status check, so it has to run on
  # every pull request rather than only on the ones that touch the book.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          # Pinned: mdBook decides the rendered HTML, so an unpinned tool would
          # let the published site change under a commit that touched nothing.
          tool: mdbook@0.5.4
      - run: cargo build --manifest-path rust/Cargo.toml --locked -p ocomment
      # The site may not restate anything the binary or spec/ no longer says.
      - run: python3 tools/gen_docs.py --check
      - run: mdbook build docs
      # `create-missing = false` in docs/book.toml makes the build above fail on
      # a SUMMARY entry with no file behind it, so this only has to catch the
      # opposite: a chapter that was written and never linked from SUMMARY.md.
      - name: Every page under docs/ is in the book
        run: |
          set -euo pipefail
          status=0
          for page in docs/*.md; do
            name=$(basename "$page")
            if [ "$name" = "SUMMARY.md" ]; then continue; fi
            if ! grep -q "($name)" docs/SUMMARY.md; then
              echo "::error file=docs/SUMMARY.md::${name} is not listed in docs/SUMMARY.md"
              status=1
            fi
          done
          exit "$status"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: target/book

  deploy-pages:
    # Pages serves one site, so a deploy is never cancelled halfway and never
    # races another: this group is deliberately separate from the workflow's.
    concurrency:
      group: pages
      cancel-in-progress: false
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write # Publish the built book as this repository's Pages site.
      id-token: write # Prove to the Pages API which workflow run is deploying.
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
