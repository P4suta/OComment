version = 1

# NOTE: Markers that take a comment out of reach of a `remove` policy.
# NOTE: Which of the two tiers each list is, why SQL's and the bundlers' are in the stronger one, and why every language answers even with an empty list:
# NOTE: see "Markers that survive a removal" in docs/why-kept.md.

# NOTE: The tool tier: `all` is entitled to these.
protected = [
  "shebang", "encoding",
  "sourceMappingURL", "sourceURL",
  "lint-and-formatter", "type-checker",
  "hadolint", ":schema", "taplo:", "---@diagnostic", "luacheck:",
  "selene:", "stylua:", "luacov:", "yaml-language-server:", "yamllint",
  "renovate:", "checkov:skip", "trivy:ignore", "nosec", "kics-scan", "@schema",
  "phpcs:", "@phpstan-ignore", "@psalm-suppress", "@codeCoverageIgnore",
  "rubocop:", "standard:", "typed:", "zig fmt:", "styler:", "nocov",
  "dart format", "ignore:", "ignore_for_file:",
  "swiftlint:", "swiftformat:", "swift-format-ignore", "<auto-generated",
  "ReSharper", "csharpier-ignore",
  "formatter:", "nosonar", "pylint:", "pragma:",
  "$non-nls", "checkstyle:", "no critic", "use critic",
  "cppcheck-suppress", "lint:ignore", "format:"
]

load_bearing = [
  "go:", "+build", "triple-slash-reference", "syntax=",
  "frozen_string_literal:", "warn_indent:", "shareable_constant_value:",
  "@dart", "swift-tools-version:", "//> using",
  # NOTE: SQL's two: the server executes one and plans by the other.
  "optimizer-hint", "version-comment",
  # NOTE: The bundlers': each decides what comes out of the build.
  "webpack", "vite-ignore",
  "#__PURE__", "@__PURE__", "#__NO_SIDE_EFFECTS__"
]

# NOTE: Every built-in language answers, an empty list included: surveyed and found to have none is a different claim from nobody having looked.
[load_bearing_by_language]
go = ["go:", "+build"]
swift = ["swift-tools-version:"]
ruby = ["frozen_string_literal:", "warn_indent:", "shareable_constant_value:"]
shell = ["syntax="]
dart = ["@dart"]
scala = ["//> using"]
typescript = ["triple-slash-reference", "webpack", "vite-ignore", "#__PURE__", "@__PURE__", "#__NO_SIDE_EFFECTS__"]
javascript = ["webpack", "vite-ignore", "#__PURE__", "@__PURE__", "#__NO_SIDE_EFFECTS__"]
sql = ["optimizer-hint", "version-comment"]

# NOTE: Surveyed and empty; docs/why-kept.md says why each one is.
rust = []
ocaml = []
c = []
cpp = []
java = []
kotlin = []
csharp = []
zig = []
php = []
perl = []
# NOTE: Python's one candidate is the encoding declaration, and that is its own kind with its own protection; `# type: ignore` addresses a checker.
python = []
# NOTE: The data and markup languages.
# NOTE: A schema reference -- `#:schema`,
# NOTE: `# yaml-language-server:` -- tells a validator what to check against and changes no output.
# NOTE: HTML's conditional comments were read by browsers no longer supported, and an HTML comment is already kept by every policy but `all`.
toml = []
yaml = []
jsonc = []
html = []
css = []
markdown = []
# NOTE: The component formats.
# NOTE: Their script and style bodies are scanned as the language they are written in, so a bundler annotation inside one is judged as JavaScript and is covered above.
vue = []
svelte = []
lua = []
r = []

# NOTE: The same question for the tool tier, and the one that decides whether a default `fix` takes a comment out.
# NOTE: Only the markers a language's own toolchain reads are named: the cross-language ones -- `eslint`, `noqa`,
# NOTE: `nolint`, `NOSONAR`, the formatter pragmas -- are recognised in every language, so naming them in each would make a list that is the same everywhere and says nothing about any of them.
# NOTE: An empty entry is the claim that a language's toolchain adds none of its own.
[protected_by_language]
csharp = ["<auto-generated", "ReSharper", "csharpier-ignore"]
c = ["cppcheck-suppress"]
cpp = ["cppcheck-suppress"]
dart = ["dart format", "ignore:", "ignore_for_file:"]
go = ["lint:ignore"]
java = ["$non-nls", "checkstyle:"]
lua = ["---@diagnostic", "luacheck:", "selene:", "stylua:", "luacov:"]
perl = ["no critic", "use critic"]
php = ["phpcs:", "@phpstan-ignore", "@psalm-suppress", "@codeCoverageIgnore"]
python = ["pylint:", "pragma:"]
r = ["styler:", "nocov"]
ruby = ["rubocop:", "standard:", "typed:"]
scala = ["format:"]
shell = ["hadolint"]
swift = ["swiftlint:", "swiftformat:", "swift-format-ignore"]
toml = [":schema", "taplo:"]
yaml = ["yaml-language-server:", "yamllint", "renovate:", "checkov:skip", "trivy:ignore", "nosec", "kics-scan", "@schema"]
zig = ["zig fmt:"]

# NOTE: Surveyed and holding nothing of their own.
# NOTE: Rust's formatter and lint suppressions are attributes rather than comments; Kotlin's three tools and the JavaScript family's are in the cross-language set; SQL's linters answer to `noqa`; Markdown's are HTML comments, which every policy but `all` keeps already; and a component format's script body is scanned as the language it is written in.
rust = []
ocaml = []
kotlin = []
javascript = []
typescript = []
sql = []
jsonc = []
html = []
css = []
markdown = []
vue = []
svelte = []

# NOTE: The mode that removes nothing, for a repository that wants the style rules and not the removals.
# NOTE: Every kind is listed rather than the table being left out: a policy absent from this matrix is a policy nothing checks, and "keeps everything" is a claim worth checking.
[policy.none]
remove = []
keep = ["line", "block", "doc-line", "doc-block", "license", "directive", "load-bearing", "html-comment", "shebang", "encoding", "optimizer-hint", "version-comment"]

[policy.conservative]
remove = ["line", "block", "doc-line", "doc-block"]
keep = ["license", "directive", "load-bearing", "html-comment", "shebang", "encoding", "optimizer-hint", "version-comment"]

[policy.standard]
remove = ["line", "block", "doc-line", "doc-block", "license"]
keep = ["directive", "load-bearing", "html-comment", "shebang", "encoding", "optimizer-hint", "version-comment"]

[policy.all]
remove = ["line", "block", "doc-line", "doc-block", "license", "directive", "html-comment"]
keep_without_force_protected = ["shebang", "encoding", "load-bearing", "optimizer-hint", "version-comment"]
