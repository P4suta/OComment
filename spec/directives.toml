version = 1

# NOTE: A marker here takes a comment out of reach of a `remove` policy, and
# NOTE: the two lists say which of the two protections it gets.
# NOTE:
# NOTE: `protected` is the tool tier: a linter suppression, a formatter switch,
# NOTE: a coverage pragma. Removing one makes a tool noisier or quieter and
# NOTE: leaves the program the same program, so `safe` and `legal` keep them
# NOTE: and `all` — which said it would take every comment — removes them.
# NOTE:
# NOTE: `load_bearing` is the tier `all` does not reach. The language, its
# NOTE: compiler or its build system reads these as part of the program: remove
# NOTE: `//go:build linux` and a file meant for one platform compiles on every
# NOTE: one, remove `# frozen_string_literal: true` and a literal a program
# NOTE: mutates stops raising. Both failures leave a file that still parses,
# NOTE: which is why no policy is allowed to cause them and `force_protected`
# NOTE: is the only way out.
protected = [
  "shebang", "encoding",
  "sourceMappingURL", "sourceURL", "#__PURE__", "@__PURE__",
  "lint-and-formatter", "type-checker", "optimizer-hint", "version-comment",
  "hadolint", ":schema", "taplo:", "---@diagnostic", "luacheck:",
  "selene:", "stylua:", "luacov:", "yaml-language-server:", "yamllint",
  "renovate:", "checkov:skip", "trivy:ignore", "nosec", "kics-scan", "@schema",
  "phpcs:", "@phpstan-ignore", "@psalm-suppress", "@codeCoverageIgnore",
  "rubocop:", "standard:", "typed:", "zig fmt:", "styler:", "nocov",
  "dart format", "ignore:", "ignore_for_file:",
  "swiftlint:", "swiftformat:", "swift-format-ignore", "<auto-generated",
  "ReSharper", "csharpier-ignore"
]

load_bearing = [
  "go:", "+build", "triple-slash-reference", "syntax=",
  "frozen_string_literal:", "warn_indent:", "shareable_constant_value:",
  "@dart", "swift-tools-version:", "//> using"
]

[policy.safe]
remove = ["line", "block", "doc-line", "doc-block", "license"]
keep = ["directive", "load-bearing", "html-comment", "shebang", "encoding", "optimizer-hint", "version-comment"]

[policy.legal]
remove = ["line", "block", "doc-line", "doc-block"]
keep = ["license", "directive", "load-bearing", "html-comment", "shebang", "encoding", "optimizer-hint", "version-comment"]

[policy.all]
remove = ["line", "block", "doc-line", "doc-block", "license", "directive", "html-comment", "optimizer-hint", "version-comment"]
keep_without_force_protected = ["shebang", "encoding", "load-bearing"]
