version = 1

[files]
max_size = 33554432
hidden = false
follow_symlinks = false
ignore = true

[policy]
mode = "safe"
layout = "lines"
keep_kind = []
remove_kind = []
keep_regex = []
remove_regex = []
force_invalid = false
force_protected = false

[git]
staged = false
index_only = false

[lsp]
on_save = false
diagnostics = true
code_lens = true

[plugins]
enabled = []
routes = {}
memory_mib = 64
instances = 4
fuel_per_byte = 128
