version = 1

# NOTE: Files another tool owns and rewrites.
# NOTE:
# NOTE: A lock file, a recorded seed list, a code-generator's output: something
# NOTE: else wrote the comments in these and will write them again. Removing one
# NOTE: is editing a tool's file, and it is the class most likely to be
# NOTE: auto-fixed without being read, because nobody opens a generated file
# NOTE: before committing it.
# NOTE:
# NOTE: This is the correction to a wrong turn. Coverage of a file you should
# NOTE: not touch is worse than skipping it: a skip is visible in the summary,
# NOTE: and a removal in a generated file is a diff somebody waves through.
# NOTE: `--deny-skipped` does not refuse these, because being passed over is
# NOTE: what should happen to them.
# NOTE:
# NOTE: `--include-generated` scans them anyway, for the run that does mean it.

# NOTE: Whole names, matched case-sensitively, because a lock file's name is a
# NOTE: convention of the tool that writes it.
filenames = [
    "Cargo.lock",
    "package-lock.json",
    "pnpm-lock.yaml",
    "yarn.lock",
    "bun.lock",
    "composer.lock",
    "Gemfile.lock",
    "poetry.lock",
    "uv.lock",
    "pdm.lock",
    "Pipfile.lock",
    "flake.lock",
    "go.sum",
    "deno.lock",
    "packages.lock.json",
]

# NOTE: Suffixes, without the dot, matched case-insensitively.
extensions = ["proptest-regressions"]

# NOTE: The general signal: the header a format uses to say the file is not
# NOTE: yours. Searched case-insensitively in the first `header_lines` lines
# NOTE: only, and that bound is what makes it usable at all.
# NOTE:
# NOTE: A file that lists these markers -- `spec/directives.toml` names C#'s
# NOTE: `<auto-generated`, and this file names all of them -- would otherwise
# NOTE: claim itself. That is the failure this repository keeps meeting: a rule
# NOTE: written out in prose matching the rule. A generated file declares
# NOTE: itself in its first few lines, because that is where the reader it is
# NOTE: warning will look, so the bound costs nothing real and rules out every
# NOTE: catalogue, changelog and piece of documentation that merely mentions
# NOTE: one.
headers = [
    "@generated",
    "do not edit",
    "do not modify",
    "automatically generated",
    "auto-generated",
    "autogenerated",
    "code generated by",
    "generated by the protocol buffer compiler",
    "this file was generated",
    "this file is generated",
]
header_lines = 5
