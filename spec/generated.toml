version = 1

# NOTE: Files another tool owns and rewrites: lock files, recorded seeds, a
# NOTE: generator's output. Why they are passed over rather than covered, and
# NOTE: what each list means: see "Files another tool writes" in
# NOTE: docs/configuration.md.

# NOTE: Whole names, matched case-sensitively.
filenames = [
    "Cargo.lock",
    "package-lock.json",
    "pnpm-lock.yaml",
    "yarn.lock",
    "bun.lock",
    "composer.lock",
    "Gemfile.lock",
    "poetry.lock",
    "uv.lock",
    "pdm.lock",
    "Pipfile.lock",
    "flake.lock",
    "go.sum",
    "deno.lock",
    "packages.lock.json",
    # NOTE: OComment's own ledger, written by `ocomment ratchet --update`.
    ".ocomment-ledger",
]

# NOTE: Suffixes, without the dot, matched case-insensitively.
extensions = ["proptest-regressions"]

# NOTE: The header a format uses to say the file is not yours, searched in the
# NOTE: first `header_lines` lines only -- without that bound this very file
# NOTE: would claim itself.
headers = [
    "@generated",
    "do not edit",
    "do not modify",
    "automatically generated",
    "auto-generated",
    "autogenerated",
    "code generated by",
    "generated by the protocol buffer compiler",
    "this file was generated",
    "this file is generated",
]
header_lines = 5
